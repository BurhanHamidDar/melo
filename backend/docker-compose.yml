version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: melo-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
      - ./uploads:/app/uploads
